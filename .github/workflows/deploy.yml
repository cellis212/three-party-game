# Build the Shiny app in app/ into a static shinylive site and publish it to
# GitHub Pages. The site runs R in the browser (webR), so it needs no server.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # shinylive reads the app's packages from the local library to find
      # the matching WebAssembly builds.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::shinydashboard
            any::plotly
            any::DT
            any::RSQLite
            any::jsonlite
            any::dplyr
            any::tidyr
            any::ggplot2
            any::shinyjs

      - name: Export the app with shinylive
        run: Rscript -e 'shinylive::export("app", "_site")'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
